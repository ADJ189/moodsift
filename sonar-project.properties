# SonarCloud configuration for Cinematch (Moodsift)
sonar.projectKey=ADJ189_Cinematch
sonar.organization=adj189

# Encoding
sonar.sourceEncoding=UTF-8

# Source and test boundaries
sonar.sources=src,worker
sonar.tests=tests
sonar.test.inclusions=tests/**

# Exclude test files from code duplication (CPD) checks
sonar.cpd.exclusions=tests/**

# Global exclusions
sonar.exclusions=dist/**,dist-e2e/**,dist-e2e-nokey/**,node_modules/**,.deno_cache/**,.wrangler/**,coverage/**,playwright-report/**,test-results/**
