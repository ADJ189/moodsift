name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  lighthouse:
    name: Lighthouse CI
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        run: npx lhci autorun

  e2e:
    name: End-to-end & accessibility (${{ matrix.name }})
    needs: lint-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium-core
            browser: chromium
            args: --project=unit --project=chromium-desktop --project=chromium-mobile
          - name: chromium-devices
            browser: chromium
            args: --project=chromium-tablet --project=chromium-small --project=chromium-landscape
          - name: webkit
            browser: webkit
            args: --project=webkit-desktop --project=webkit-mobile
          - name: firefox
            browser: firefox
            args: --project=firefox-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Install Playwright (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Builds with a dummy TMDB key and mocks every TMDB response, so the
      # suite is deterministic and never calls the live API.
      - name: Run Playwright tests (${{ matrix.name }})
        run: npx playwright test --workers=3 ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report
            test-results
          retention-days: 7
